name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:practical
      - run: npm run build:guide
      - run: git diff --exit-code -- web/guide/catalog.json
      - run: npm run build:store
      - run: git diff --exit-code -- web/reliable-store.js
