<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恢复原状</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0d1b2a;color:#e8eef5;font:600 22px -apple-system,"PingFang SC",sans-serif;text-align:center}small{display:block;margin-top:10px;font-weight:400;font-size:15px;opacity:.7}</style></head>
<body><div id="m">正在恢复原状…</div>
<script>
let theme = 'tide';
try { theme = (JSON.parse(localStorage.getItem('xilixiwai-demo-v1') || '{}').theme) || 'tide'; } catch {}
try { localStorage.removeItem('xilixiwai-demo-v1'); localStorage.removeItem('rourou-world-v1'); localStorage.setItem('xilixiwai-demo-v1', JSON.stringify({ theme })); sessionStorage.clear(); } catch {}
document.getElementById('m').innerHTML = '✓ 已恢复原状，可以重新演示<small>工作台、肉肉都回到初始状态，马上进入工作台…</small>';
setTimeout(() => location.replace('index.html#home'), 1200);
</script></body></html>
